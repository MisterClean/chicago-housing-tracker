name: Test permit boundary periods

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  permit-periods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_permit_periods.py'
      - run: npm run build
      - run: npm run lint
