name: Refresh newsletter coverage

# Daily at 14:00 UTC (morning in Chicago). Commits only when the list of
# posts tagged "Housing" on Substack has changed, so most runs do nothing;
# a commit redeploys the site.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Re-run the importer
        # Fails, writing nothing, if the archive API errors or returns far
        # fewer tagged posts than are already committed.
        run: python scripts/import_posts.py

      - name: Check whether anything changed
        id: diff
        run: |
          if git diff --quiet -- src/data/blogPosts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in coverage."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data/blogPosts.json
          fi

      - name: Verify the site still builds with the new list
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blogPosts.json
          git commit -m "Refresh newsletter coverage ($(date -u +%Y-%m-%d))

          Automated pull of posts tagged Housing on Substack."
          git push
